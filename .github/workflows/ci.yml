name: portable-workflow
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python dependencies
        run: python -m pip install -r requirements.txt
      - name: FFmpeg Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: FFmpeg macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: FFmpeg Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Isolated integration (no credentials, tone audio fixture)
        run: python tests/integration.py --output "${{ runner.temp }}/video-style-studio-acceptance"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ runner.os }}
          path: ${{ runner.temp }}/video-style-studio-acceptance/integration-report.json
